  <style>
    /* ─── Global animation keyframes ───────────────────────────────── */
    /* правка 13 · ледь помітне «дихання» пуш-плашки */
    @keyframes mp-bob {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(2px) scale(1); }
    }
    /* стрілка на пуші легенько кличе натиснути */
    @keyframes mp-nudge {
      0%, 100% { transform: translateX(0); }
      50%      { transform: translateX(3px); }
    }
    /* випадайка форматів опускається з-під шапки */
    @keyframes px-drop {
      from { transform: translateY(-14px); opacity: 0; }
      to   { transform: translateY(0);     opacity: 1; }
    }
    /* екран режиму виїжджає знизу — однаково в кеші й турнірах */
    @keyframes px-up {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    @keyframes rb-scatter0 { to { transform: translate(-150px,-120px) rotate(400deg); opacity: 0; } }
    @keyframes rb-scatter1 { to { transform: translate(140px,-140px) rotate(-380deg); opacity: 0; } }
    @keyframes rb-scatter2 { to { transform: translate(-120px,110px) rotate(300deg); opacity: 0; } }
    @keyframes rb-scatter3 { to { transform: translate(160px,90px) rotate(-320deg); opacity: 0; } }
    @keyframes pp-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: .55; transform: scale(.88); }
    }
    @keyframes pp-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pp-float {
      0%, 100% { transform: translateY(0) rotate(15deg); }
      50%      { transform: translateY(-8px) rotate(20deg); }
    }
    @keyframes pp-sweep {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    @keyframes pp-ring {
      0%   { transform: scale(1);   opacity: .55; }
      100% { transform: scale(1.4); opacity: 0;   }
    }
    @keyframes pp-fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes pp-rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pp-bobble {
      0%, 100% { transform: translateY(0)    rotate(-3deg); }
      50%      { transform: translateY(-10px) rotate(3deg); }
    }
    @keyframes pp-bobble-2 {
      0%, 100% { transform: translateY(0)    rotate(2deg); }
      50%      { transform: translateY(-12px) rotate(-2deg); }
    }
    @keyframes pp-bobble-3 {
      0%, 100% { transform: translateY(-4px) rotate(-1deg); }
      50%      { transform: translateY(6px)  rotate(2deg); }
    }
    @keyframes pp-pulse-ring {
      0%   { box-shadow: 0 14px 34px rgba(0,0,0,.45), 0 0 0 6px rgba(255,255,255,.14); }
      70%  { box-shadow: 0 14px 34px rgba(0,0,0,.45), 0 0 0 22px rgba(255,255,255,0); }
      100% { box-shadow: 0 14px 34px rgba(0,0,0,.45), 0 0 0 6px rgba(255,255,255,.14); }
    }
    @keyframes pp-claim-pop {
      0%   { transform: scale(.55); }
      55%  { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    @keyframes pp-check-draw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes pp-burst {
      0%   { transform: scale(.7);  opacity: .8; }
      100% { transform: scale(2.5); opacity: 0;  }
    }
    @keyframes comp-floatA { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(2deg); } }
    @keyframes comp-floatB { 0%,100% { transform: translateY(-3px) rotate(3deg); } 50% { transform: translateY(6px) rotate(-3deg); } }
    @keyframes sg-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes sg-pop  { 0%{transform:scale(.4);opacity:0} 55%{transform:scale(1.12)} 75%{transform:scale(.96)} 100%{transform:scale(1);opacity:1} }

    /* ─── no blinking: flashing keyframes neutralised app-wide (redefined last) ─ */
    @keyframes pp-pulse { 0%, 100% { opacity: 1; transform: none } }
    @keyframes pp-ring { 0%, 100% { opacity: 0; transform: scale(1) } }

    /* dock logo — a slow breathe, not a blink (deliberately after the neutralisers) */
    @keyframes nav-breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.045) } }

    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      background: #050505;
      font-family: "Chakra Petch", "Geist Mono", ui-monospace, monospace;
      color: #fff;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Page stage — center the device, render the brand mark beside ── */
    .stage {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 32px;
      gap: 60px;
      position: relative;
      background:
        radial-gradient(ellipse 80% 60% at 30% 20%, rgba(215,25,33,.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 90%, rgba(255,255,255,.03) 0%, transparent 60%),
        #050505;
    }
    /* dot grid overlay on the page bg */
    .stage::before {
      content: "";
      position: fixed; inset: 0; pointer-events: none;
      background-image: radial-gradient(circle, rgba(255,255,255,.025) 0.7px, transparent 1px);
      background-size: 22px 22px;
      mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 30%, transparent 80%);
    }

    .brand-mark {
      position: relative;
      max-width: 320px;
    }
    .brand-mark .kicker {
      font-family: "Chakra Petch", monospace; font-size: 11px;
      letter-spacing: .32em; color: rgba(255,255,255,.45);
      margin-bottom: 12px;
    }
    .brand-mark h1 {
      font-family: "Chakra Petch", monospace; font-size: 56px;
      line-height: .92; letter-spacing: .02em; margin: 0;
      color: #fff;
    }
    .brand-mark .desc {
      font-family: "Chakra Petch", monospace; font-size: 12px;
      line-height: 1.6; letter-spacing: .04em;
      color: rgba(255,255,255,.55); margin-top: 18px;
      max-width: 280px;
    }
    .brand-mark .meta {
      margin-top: 24px;
      display: flex; flex-direction: column; gap: 6px;
      font-family: "Chakra Petch", monospace; font-size: 10px;
      letter-spacing: .14em; color: rgba(255,255,255,.4);
    }
    .brand-mark .meta b { color: #fff; font-weight: normal; }
    .brand-mark .accent-bar {
      width: 80px; height: 3px; background: #D71921;
      margin-top: 28px;
      box-shadow: 0 0 12px rgba(215,25,33,.6);
    }

    @media (max-width: 900px) {
      .stage { gap: 0; padding: 0; }
      .brand-mark { display: none; }
    }

    /* hide scrollbars inside the device */
    *::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }
